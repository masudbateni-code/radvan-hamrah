<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>رادوان همراه | هویت مشتری</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700&display=swap');
*{box-sizing:border-box}body{margin:0;padding:26px;background:#f4f6f9;color:#202938;font-family:Vazirmatn,Tahoma,sans-serif}.wrap{max-width:1000px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:20px}h1{font-size:24px;margin:0}h2{font-size:18px;margin:0 0 16px}.muted{color:#64748b;font-size:13px;margin-top:6px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:white;border:1px solid #e1e6ed;border-radius:15px;padding:22px}label{display:block;margin:12px 0 6px;font-size:13px;color:#526174}input{width:100%;padding:12px;border:1px solid #d5dce5;border-radius:9px;font:inherit;background:#fbfcfd}button{font:inherit;padding:10px 15px;margin-top:13px;border:0;border-radius:9px;background:#1d5d8f;color:white;cursor:pointer}.secondary{background:#eaf0f6;color:#29465e}.danger{background:#9a4c32}.row{display:flex;gap:8px;flex-wrap:wrap}.note{padding:12px 14px;background:#eef5fa;border-radius:9px;color:#35536b;font-size:13px;margin-bottom:18px}.msg{font-size:13px;margin-top:12px}.ok{color:#14764b}.err{color:#b33a32}.result{display:none;background:#f4f7fa;padding:14px;border-radius:10px;margin-top:14px}.result.show{display:block}.kv{display:grid;grid-template-columns:115px 1fr;gap:9px;font-size:13px}.kv span{color:#64748b}@media(max-width:700px){body{padding:14px}.grid{grid-template-columns:1fr}header{align-items:flex-start;flex-direction:column}}
</style></head><body><div class="wrap"><header><div><h1>همراه | مدیریت هویت مشتری</h1><div class="muted">مرحله اول توسعه: ثبت، شناسایی و وضعیت حساب مشتری</div></div><button class="secondary" onclick="location.href='employee.html'">پنل کارمند</button></header>
<div class="note">نسخه توسعه‌ای: داده‌ها فعلاً در مرورگر ذخیره می‌شوند. این محیط پایگاه داده مرکزی یا احراز هویت امن نیست و برای بهره‌برداری واقعی باید به API و دیتابیس سرور متصل شود.</div>
<div class="grid"><section class="card"><h2>ثبت مشتری جدید</h2><label>نام و نام خانوادگی</label><input id="fullName" placeholder="مثلاً آرمان فرهمند"><label>شماره موبایل</label><input id="phone" inputmode="tel" placeholder="۰۹۱۲۳۴۵۶۷۸۹"><button onclick="register()">ثبت و ایجاد شناسه عضویت</button><div id="registerMsg" class="msg"></div><div id="created" class="result"></div></section>
<section class="card"><h2>جست‌وجو و مدیریت پرونده</h2><label>شماره موبایل، شناسه عضویت یا کد QR</label><input id="query" placeholder="HM-10245"><div class="row"><button onclick="search()">جست‌وجو</button><button class="secondary" onclick="seed()">مشتری نمونه</button></div><div id="searchMsg" class="msg"></div><div id="result" class="result"></div></section></div></div>
<script>
const $=id=>document.getElementById(id);
function message(id,t,ok){$(id).textContent=t;$(id).className='msg '+(ok?'ok':'err')}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function api(url,opts={}){const r=await fetch(url,{headers:{'Content-Type':'application/json'},...opts});const data=await r.json();if(!r.ok)throw new Error(data.error||'خطا در ارتباط با سرور');return data}
async function register(){try{const c=await api('/api/customers',{method:'POST',body:JSON.stringify({fullName:$('fullName').value,phone:$('phone').value})});message('registerMsg','مشتری با موفقیت در پایگاه داده ثبت شد.',true);$('created').classList.add('show');$('created').innerHTML='<b>شناسه عضویت: '+esc(c.membershipId)+'</b><br>کد QR: <code>'+esc(c.qrToken)+'</code>';$('query').value=c.membershipId;show(c)}catch(e){message('registerMsg',e.message,false)}}
async function search(){const q=$('query').value.trim();if(!q){message('searchMsg','شماره یا شناسه را وارد کنید.',false);return}try{const c=await api('/api/customers?q='+encodeURIComponent(q));message('searchMsg','پرونده از پایگاه داده مرکزی خوانده شد.',true);show(c)}catch(e){$('result').classList.remove('show');message('searchMsg',e.message,false)}}
function show(c){$('result').classList.add('show');$('result').innerHTML='<div class="kv"><span>نام</span><b>'+esc(c.fullName)+'</b><span>موبایل</span><b>'+esc(c.phone)+'</b><span>شناسه عضویت</span><b>'+esc(c.membershipId)+'</b><span>شناسه داخلی</span><code>'+esc(c.id)+'</code><span>کد QR</span><code>'+esc(c.qrToken||'—')+'</code><span>وضعیت</span><b>'+(c.status==='active'?'فعال':'غیرفعال')+'</b></div><button class="'+(c.status==='active'?'danger':'secondary')+'" onclick="toggleStatus(\''+esc(c.id)+'\',\''+(c.status==='active'?'inactive':'active')+'\')">'+(c.status==='active'?'غیرفعال‌سازی حساب':'فعال‌سازی حساب')+'</button>'}
function seed(){$('query').value='HM-10245';search()}
async function toggleStatus(id,status){try{const c=await api('/api/customers/'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status})});message('searchMsg','وضعیت حساب در پایگاه داده به‌روزرسانی شد.',true);show(c)}catch(e){message('searchMsg',e.message,false)}}
</script></body></html>
